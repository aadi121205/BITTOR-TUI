name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install textual==8.2.8 aiohttp==3.14.3 aiohttp-socks==0.11.0 coincurve==21.0.0 cryptography==49.0.0
          pip install pyinstaller pyinstaller-hooks-contrib

      - name: Build Windows exe
        run: |
          pyinstaller --name bitchat-tui --onefile --noconfirm --collect-all textual --collect-all coincurve --collect-all aiohttp_socks run_bitchat_tui.py

      - name: Upload exe to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "dist/bitchat-tui.exe" --clobber --repo "${{ github.repository }}"
